# ~/.tmux.conf: tmux configuration

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
# Enable 256 colors and TrueColor support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Increase scrollback buffer size
set -g history-limit 50000

# Faster command sequences (remove escape delay in vim)
set -s escape-time 0

# Enable mouse support (scrolling, pane resizing, selection)
set -g mouse on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# -----------------------------------------------------------------------------
# Key Bindings
# -----------------------------------------------------------------------------
# Reload tmux config with 'r'
bind r source-file ~/.tmux.conf \; display-message "Config reloaded: ~/.tmux.conf"

# Split windows using | and - preserving current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Alt + arrow keys without prefix repeat
bind -n M-Left resize-pane -L 3
bind -n M-Right resize-pane -R 3
bind -n M-Up resize-pane -U 3
bind -n M-Down resize-pane -D 3

# -----------------------------------------------------------------------------
# Status Bar & Styling
# -----------------------------------------------------------------------------
set -g status-interval 5
set -g status-justify left
set -g status-style bg='#1e1e2e',fg='#cdd6f4'

# Left status: Session name
set -g status-left-length 30
set -g status-left '#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#1e1e2e,fg=#89b4fa] '

# Right status: Hostname, date, and time
set -g status-right-length 60
set -g status-right '#[fg=#a6adc8] %Y-%m-%d │ %H:%M #[bg=#a6e3a1,fg=#11111b,bold] #h '

# Window status tabs
setw -g window-status-format ' #[fg=#6c7086]#I:#[fg=#a6adc8]#W '
setw -g window-status-current-format '#[bg=#313244,fg=#f38ba8,bold] #I:#[fg=#ffffff,bold]#W '

# Pane border colors
set -g pane-border-style fg='#313244'
set -g pane-active-border-style fg='#89b4fa'
